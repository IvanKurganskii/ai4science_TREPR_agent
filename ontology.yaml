# Онтология проекта: спектры ЭПР, квантовые состояния и оценивание параметров.
# Карточки: ../.mars_env/bin/python "/mnt/c/Users/kurga/OneDrive/Документы/YSDA/checks/gen_ontology_notes.py" --root "$PWD" --check
# Численные и физические правила требуют отдельной предметной проверки.

ontology: ЭПРСпектрыИМоделирование
goal: >
  Связывать эксперименты и спектральные данные ЭПР с условиями регистрации,
  квантовыми состояниями, моделями, параметрами и проверками результатов.
  Помогать исследователю и агенту различать физический отклик, его измеренное
  представление и выводы, подтверждённые данными или явно заданными допущениями.

# Компетентностные вопросы: 3–5. Каждый класс и каждое отношение нужны хотя бы одному.
competency_questions:
  - Каким методом и в каком режиме СВЧ получен спектр, каковы условия его регистрации и происхождение?
  - Какая гармоника или производная представлена в данных и при каких условиях их можно сопоставлять?
  - Каким спиновым состоянием и переходами объясняются поглощение и эмиссия СВЧ и как проверено соглашение о знаке?
  - Какие параметры в данной постановке варьируются независимо, вычисляются через другие или фиксированы?
  - Какие статистические связи между оценками параметров установлены, чем они подтверждены и насколько параметры идентифицируемы?

# Классы — множества объектов. Имя — существительное в единственном числе, без пробелов.
# parent — надкласс (null для верхних классов); definition — признак, по которому объект
# попадает в класс. Экземпляры (конкретная серия, конкретная статья) сюда не пишутся.
classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — задача, утверждение, данные, метод, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — опыт, расчёт, проверка
  Файл:
    parent: null
    definition: файл проекта — таблица, код, текст, источник; узел графа — сам файл, заметка о нём не нужна
  Задача:
    parent: ИнформационныйОбъект
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Утверждение:
    parent: ИнформационныйОбъект
    definition: высказывание, которое может оказаться истинным или ложным
  Гипотеза:
    parent: Утверждение
    definition: утверждение, которое проверяют в эксперименте
  Результат:
    parent: Утверждение
    definition: утверждение, полученное в эксперименте, с числом и условиями
  НаборДанных:
    parent: ИнформационныйОбъект
    definition: таблица или серия измерений
  Метод:
    parent: ИнформационныйОбъект
    definition: способ обработки данных или постановки опыта
  # Метод, конкретный опыт и полученные данные относятся к разным ветвям.
  # Термин ЭПР: https://goldbook.iupac.org/terms/view/E02005
  # Пример временно-разрешённой регистрации: https://doi.org/10.1039/D3CC04802K
  Спектроскопия:
    parent: Метод
    definition: метод исследования системы по зависимости зарегистрированного сигнала взаимодействия с излучением от спектральной координаты
  МагнитнорезонанснаяСпектроскопия:
    parent: Спектроскопия
    definition: спектроскопия резонансных переходов между магнитными энергетическими уровнями системы
  ЭПРспектроскопия:
    parent: МагнитнорезонанснаяСпектроскопия
    definition: магниторезонансная спектроскопия электронных состояний парамагнитной системы, основанная на переходах между их магнитными энергетическими уровнями
  ВРЭПРспектроскопия:
    parent: ЭПРспектроскопия
    definition: ЭПР-спектроскопия с регистрацией изменения сигнала во времени относительно заданного воздействия на систему
  CWЭПРспектроскопия:
    parent: ЭПРспектроскопия
    definition: непрерывноволновая ЭПР-спектроскопия (CW-EPR, CWEPR) с непрерывным СВЧ-зондированием; способ детектирования и характер спиновых населённостей задаются отдельно
  МетодРегистрации:
    parent: Метод
    definition: способ преобразования физического отклика в регистрируемый сигнал
  ПрямаяРегистрация:
    parent: МетодРегистрации
    definition: регистрация отклика без выделения гармоник модуляции магнитного поля; фазочувствительное СВЧ-смешение при этом возможно
  СинхронноеДетектирование:
    parent: МетодРегистрации
    definition: выделение компоненты сигнала на заданной частоте и фазе относительно опорного колебания
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в library/
  Ограничение:
    parent: ИнформационныйОбъект
    definition: известный дефект данных или условие применимости
  Отчёт:
    parent: ИнформационныйОбъект
    definition: текст об исследовании для читателя; заметка отчёта — сам файл в reports/
  Эксперимент:
    parent: Процесс
    definition: опыт или расчёт, который проверяет гипотезу
  СпектроскопическийЭксперимент:
    parent: Эксперимент
    definition: эксперимент, в котором для исследования системы применяют метод спектроскопии
  ЭПРэксперимент:
    parent: СпектроскопическийЭксперимент
    definition: конкретный эксперимент с образцом, в котором применяют ЭПР-спектроскопию при заданных условиях регистрации
  ВРЭПРэксперимент:
    parent: ЭПРэксперимент
    definition: ЭПР-эксперимент, в котором регистрируют временную зависимость сигнала относительно заданного воздействия на образец
  CWЭПРэксперимент:
    parent: ЭПРэксперимент
    definition: ЭПР-эксперимент с непрерывным СВЧ-зондированием; он может исследовать тепловое или неравновесное спиновое состояние
  УсловияРегистрацииЭПР:
    parent: ИнформационныйОбъект
    definition: описание режима СВЧ, метода регистрации, модуляции, фаз, мощности и соглашений, необходимых для интерпретации конкретных данных ЭПР
  МодуляцияМагнитногоПоля:
    parent: Процесс
    definition: периодическое изменение магнитного поля с заданными частотой, формой и соглашением об амплитуде
  СерияЭкспериментов:
    parent: Процесс
    definition: составной процесс, объединяющий несколько связанных экспериментов по общему плану исследования
  ФизическийОбъект:
    parent: null
    definition: материальный объект, существующий независимо от его описания и представления в данных
  Образец:
    parent: ФизическийОбъект
    definition: конкретный материальный объект или порция вещества, непосредственно исследуемые в эксперименте
  СпектральныеДанные:
    parent: НаборДанных
    definition: набор значений спектроскопического сигнала с координатами и сведениями об условиях их получения
  ЭПРданные:
    parent: СпектральныеДанные
    definition: спектральные данные, представляющие сигнал ЭПР и координаты его регистрации или расчёта
  ВРЭПРданные:
    parent: ЭПРданные
    definition: данные ЭПР с временной координатой относительно заданного воздействия и указанным началом отсчёта
  ЭПРспектр:
    parent: ЭПРданные
    definition: зависимость сигнала ЭПР от магнитной индукции или частоты при фиксированных остальных условиях, в том числе временном срезе
  CWЭПРспектр:
    parent: ЭПРспектр
    definition: спектр ЭПР для непрерывного СВЧ-зондирования (CW-EPR, CWEPR); номер гармоники, представление сигнала и спиновое состояние не определяются одним этим названием
  ВРЭПРспектр:
    parent: [ЭПРспектр, ВРЭПРданные]
    definition: спектр ЭПР при указанной задержке или временном окне относительно воздействия с заданным началом отсчёта
  СпинПоляризованныйЭПРспектр:
    parent: ЭПРспектр
    definition: спектр ЭПР, содержащий отклик неравновесной электронной спиновой поляризации относительно указанного теплового состояния сравнения
  СпинПоляризованныйCWЭПРспектр:
    parent: [СпинПоляризованныйЭПРспектр, CWЭПРспектр]
    definition: спин-поляризованный спектр ЭПР для непрерывного СВЧ-зондирования
  СпинПоляризованныйВРЭПРспектр:
    parent: [СпинПоляризованныйЭПРспектр, ВРЭПРспектр]
    definition: спин-поляризованный спектр ЭПР при указанной задержке или временном окне относительно воздействия
  ТепловойЭПРспектр:
    parent: ЭПРспектр
    definition: спектр ЭПР, соответствующий отклику спиновой системы с тепловым распределением при указанных гамильтониане и температуре
  КомпонентаЭПРспектра:
    parent: ЭПРданные
    definition: выделенная часть или слагаемое спектральных данных ЭПР с указанными родительским спектром, координатами и способом выделения
  АбсорбционнаяКомпонентаЭПР:
    parent: КомпонентаЭПРспектра
    definition: компонента ЭПР, отвечающая положительному чистому переносу энергии СВЧ-поля к спиновой системе в физическом представлении отклика
  ЭмиссионнаяКомпонентаЭПР:
    parent: КомпонентаЭПРспектра
    definition: компонента ЭПР, отвечающая чистому усилению СВЧ-поля за счёт вынужденного испускания спиновой системой
  ДисперсионнаяКомпонентаЭПР:
    parent: КомпонентаЭПРспектра
    definition: компонента ЭПР, соответствующая реактивной, дисперсионной части СВЧ-отклика при заданном фазовом соглашении
  Проверка:
    parent: Процесс
    definition: независимая проверка результата другим способом
  Программа:
    parent: Файл
    definition: набор инструкций, которые компьютер выполняет для решения определённой задачи
  Модель:
    parent: ИнформационныйОбъект
    definition: математическое описание физической системы, основанное на выбранных законах и допущениях и позволяющее исследовать и предсказывать её поведение с помощью численных расчётов
  МатематическийОбъект:
    parent: ИнформационныйОбъект
    definition: абстрактная сущность, определяемая математическими свойствами и отношениями
  Оператор:
    parent: Функция
    definition: функция, задающая линейное преобразование векторов состоянийй
  Гамильтониан:
    parent: Оператор
    definition: оператор полной энергии квантовой системы, задающий её временную эволюцию
  СпиновыйГамильтониан:
    parent: Гамильтониан
    definition: гамильтониан, выраженный через операторы спина и описывающий энергию спиновых степеней свободы системы
  ФизическаяВеличина:
    parent: ИнформационныйОбъект
    definition: количественная характеристика физической системы, её состояния или процесса
  МоментИмпульса:
    parent: ФизическаяВеличина
    definition: векторная величина, характеризующая вращательные свойства системы
  Спин:
    parent: МоментИмпульса
    definition: собственный момент импульса квантовой системы
  Скаляр:
    parent: МатематическийОбъект
    definition: числовой элемент поля, над которым задано векторное пространство
  Вектор:
    parent: МатематическийОбъект
    definition: элемент векторного пространства
  Функция:
    parent: МатематическийОбъект
    definition: отображение, сопоставляющее каждому аргументу единственное значение
  ГармоникаСигнала:
    parent: Функция
    definition: компонента периодического сигнала с целым неотрицательным номером n; её частота равна n*f0 для опорной частоты f0, а n=0 обозначает постоянную составляющую
  ГармоникаМодуляционногоОтклика:
    parent: ГармоникаСигнала
    definition: гармоническая компонента отклика ЭПР относительно периодической модуляции магнитного поля, параметры которой заданы условиями регистрации
  ВекторСостояния:
    parent: Вектор
    definition: ненулевой вектор гильбертова пространства, представляющий чистое квантовое состояние
  СобственныйВектор:
    parent: Вектор
    definition: ненулевой вектор, который оператор преобразует в тот же вектор, умноженный на скаляр
  СобственноеЗначение:
    parent: Скаляр
    definition: коэффициент, на который оператор умножает соответствующий собственный вектор
  СобственнаяПара:
    parent: МатематическийОбъект
    definition: пара собственного значения и соответствующего собственного вектора заданного оператора
  Состояние:
    parent: ИнформационныйОбъект
    definition: описание системы в заданный момент времени в рамках выбранной модели
  КвантовоеСостояние:
    parent: Состояние
    definition: состояние, определяющее вероятности результатов квантовых измерений
  СпиновоеСостояние:
    parent: КвантовоеСостояние
    definition: квантовое состояние спиновых степеней свободы в пространстве выбранной спиновой модели
  ТепловоеСпиновоеСостояние:
    parent: СпиновоеСостояние
    definition: спиновое состояние с каноническим распределением Гиббса при указанных гамильтониане и температуре
  НеравновесноеСпиновоеСостояние:
    parent: СпиновоеСостояние
    definition: спиновое состояние, отличающееся от теплового состояния сравнения при указанных гамильтониане и температуре
  СпиноваяПоляризация:
    parent: ФизическаяВеличина
    definition: характеристика ориентации и упорядоченности спинового ансамбля, задаваемая населённостями и при необходимости когерентностями его состояний
  НеравновеснаяСпиноваяПоляризация:
    parent: СпиноваяПоляризация
    definition: спиновая поляризация, отличающаяся от тепловой при выбранных гамильтониане и температуре сравнения
  КвантовыйПереход:
    parent: КвантоваяЭволюция
    definition: переход квантовой системы между указанными начальным и конечным состояниями
  СпиновыйПереход:
    parent: КвантовыйПереход
    definition: квантовый переход между состояниями спиновых степеней свободы выбранной модели
  Эволюция:
    parent: Процесс
    definition: изменение состояния системы во времени
  КвантоваяЭволюция:
    parent: Эволюция
    definition: изменение квантового состояния системы во времени
  УнитарнаяЭволюция:
    parent: КвантоваяЭволюция
    definition: квантовая эволюция, описываемая унитарным преобразованием состояния
  МатематическоеСоотношение:
    parent: МатематическийОбъект
    definition: формальная запись связи между математическими выражениями
  Уравнение:
    parent: МатематическоеСоотношение
    definition: равенство математических выражений, содержащее неизвестные
  ЧистоеКвантовоеСостояние:
    parent: КвантовоеСостояние
    definition: квантовое состояние, представимое одним вектором состояния
  СмешанноеКвантовоеСостояние:
    parent: КвантовоеСостояние
    definition: квантовое состояние, описываемое статистической смесью чистых состояний и не представимое одним вектором состояния
  СобственноеСостояниеЭнергии:
    parent: ЧистоеКвантовоеСостояние
    definition: состояние с определённой энергией, представленное собственным вектором гамильтониана
  СобственноеСпиновоеСостояние:
    parent: [СпиновоеСостояние, СобственноеСостояниеЭнергии]
    definition: собственное состояние спинового гамильтониана при заданных поле и условиях модели
  ВолноваяФункция:
    parent: Функция
    definition: функция амплитуд вероятности, представляющая чистое квантовое состояние в выбранном базисе
  СпиноваяВолноваяФункция:
    parent: ВолноваяФункция
    definition: волновая функция спиновых степеней свободы в выбранном спиновом базисе
  ОператорПлотности:
    parent: Оператор
    definition: положительный оператор с единичным следом, представляющий чистое или смешанное квантовое состояние
  ОператорСпина:
    parent: Оператор
    definition: оператор компоненты спина или квадрата его модуля
  Энергия:
    parent: ФизическаяВеличина
    definition: физическая величина, представленная гамильтонианом в квантовой механике
  УровеньЭнергии:
    parent: СобственноеЗначение
    definition: допустимое дискретное значение энергии системы, определяемое собственным значением гамильтониана
  Вероятность:
    parent: Скаляр
    definition: вещественное число от нуля до единицы, характеризующее возможность события
  НаселённостьУровняЭнергии:
    parent: Вероятность
    definition: вероятность обнаружить систему на заданном уровне энергии в заданном квантовом состоянии
  ПараметрМодели:
    parent: ИнформационныйОбъект
    definition: величина, значение которой задаёт конкретный вариант модели или её компонента
  # Роли относятся к конкретной постановке, а не к параметру модели навсегда.
  ПостановкаОценивания:
    parent: ИнформационныйОбъект
    definition: описание определения параметров выбранной модели по заданным данным при указанных параметризации, критерии, ограничениях и условиях
  ОцениваниеПараметров:
    parent: Процесс
    definition: определение значений параметров модели по данным в рамках заданной постановки
  ПараметрВЗадаче:
    parent: ИнформационныйОбъект
    definition: описание роли конкретного параметра модели в одной постановке оценивания
  НезависимыйПараметр:
    parent: ПараметрВЗадаче
    definition: свободная координата подбора, которая варьируется и не вычисляется из остальных координат по заданным точным равенствам; это независимость при варьировании, а не утверждение о статистической независимости
  ЗависимыйПараметр:
    parent: ПараметрВЗадаче
    definition: параметр, значение которого в данной постановке вычисляется из других параметров по заданной функциональной зависимости
  ФиксированныйПараметр:
    parent: ПараметрВЗадаче
    definition: параметр, значение которого задано и не варьируется в данной постановке
  КоррелированныйПараметр:
    parent: ПараметрВЗадаче
    definition: параметр, для которого в указанном вероятностном описании установлена ненулевая корреляция Пирсона хотя бы с одним другим параметром
  НекоррелированныйПараметр:
    parent: ПараметрВЗадаче
    definition: параметр, имеющий нулевую ковариацию с указанным другим параметром при конечных вторых моментах в рассматриваемом распределении
  СтатистическиНезависимыйПараметр:
    parent: ПараметрВЗадаче
    definition: параметр, входящий в указанный совместно статистически независимый набор в заданном вероятностном описании
  ОценкаПараметра:
    parent: ИнформационныйОбъект
    definition: результат оценивания значения параметра в конкретной постановке с указанием способа получения и доступных сведений о неопределённости
  АнализЗависимостиПараметров:
    parent: Проверка
    definition: исследование связей и неопределённости параметров в заданной постановке с указанием метода и вероятностного описания
  СоотношениеПараметров:
    parent: МатематическоеСоотношение
    definition: формальное условие для одного или нескольких параметров в одной постановке с указанием участников и условий применимости
  ОграничениеПараметров:
    parent: [СоотношениеПараметров, Ограничение]
    definition: математическое условие, ограничивающее допустимые совместные значения параметров в данной постановке
  ФункциональнаяЗависимостьПараметров:
    parent: ОграничениеПараметров
    definition: точное соотношение, определяющее значение одного зависимого параметра через значения других параметров на указанной допустимой области
  СтатистическаяЗависимостьПараметров:
    parent: СоотношениеПараметров
    definition: соотношение, при котором совместный закон вероятностей рассматриваемых параметров не равен произведению их отдельных законов
  КорреляцияПараметров:
    parent: СтатистическаяЗависимостьПараметров
    definition: ненулевая линейная корреляция двух параметров в указанном распределении, описанная коэффициентом Пирсона при конечных положительных дисперсиях
  НекоррелированностьПараметров:
    parent: СоотношениеПараметров
    definition: равенство нулю ковариации двух параметров при конечных вторых моментах в указанном распределении
  СтатистическаяНезависимостьПараметров:
    parent: СоотношениеПараметров
    definition: факторизация совместного закона вероятностей указанного набора параметров в произведение их отдельных законов при заданных условиях
  КоэффициентКорреляции:
    parent: Скаляр
    definition: безразмерный коэффициент Пирсона, равный ковариации двух величин, делённой на произведение их стандартных отклонений при конечных положительных дисперсиях
  Матрица:
    parent: МатематическийОбъект
    definition: прямоугольный массив элементов с заданным порядком строк и столбцов
  КовариационнаяМатрица:
    parent: Матрица
    definition: квадратная матрица попарных ковариаций упорядоченного набора случайных величин с конечными вторыми моментами
  КорреляционнаяМатрица:
    parent: Матрица
    definition: квадратная матрица попарных коэффициентов Пирсона упорядоченного набора случайных величин с конечными положительными дисперсиями
  ИдентифицируемостьПараметров:
    parent: ИнформационныйОбъект
    definition: характеристика возможности различить значения параметров или их комбинаций по предсказаниям модели либо по доступным данным в указанных условиях
  Перепараметризация:
    parent: Метод
    definition: способ замены координат параметров с явным отображением между описаниями одной модели и соответствующими допустимыми областями
  ПараметрРНП:
    parent: ПараметрМодели
    definition: параметр квадратичного спинового гамильтониана расщепления в нулевом поле
  АксиальныйПараметрРНП:
    parent: ПараметрРНП
    definition: параметр D, задающий аксиальную составляющую расщепления в нулевом поле
  РомбическийПараметрРНП:
    parent: ПараметрРНП
    definition: параметр E, задающий ромбическую составляющую расщепления в нулевом поле
  ФизическоеЯвление:
    parent: null
    definition: проявление физических закономерностей в свойствах или поведении системы
  ЭлектромагнитноеИзлучение:
    parent: ФизическийОбъект
    definition: распространяющееся электромагнитное поле, переносящее энергию
  СВЧизлучение:
    parent: ЭлектромагнитноеИзлучение
    definition: электромагнитное излучение микроволнового диапазона с указанной частотой
  ВзаимодействиеСИзлучением:
    parent: Процесс
    definition: обмен энергией между физической системой и электромагнитным излучением
  ПоглощениеСВЧ:
    parent: ВзаимодействиеСИзлучением
    definition: передача энергии СВЧ-излучения системе; синоним — абсорбция СВЧ
  ЭмиссияСВЧ:
    parent: ВзаимодействиеСИзлучением
    definition: передача энергии системы СВЧ-излучению при испускании; включает спонтанный и вынужденный механизмы
  ВынужденнаяЭмиссияСВЧ:
    parent: ЭмиссияСВЧ
    definition: испускание СВЧ-излучения, индуцированное действующим СВЧ-полем
  РасщеплениеВНулевомПоле:
    parent: ФизическоеЯвление
    definition: разделение энергий спиновых подуровней при отсутствии внешнего магнитного поля вследствие анизотропных взаимодействий
  СлагаемоеГамильтониана:
    parent: Оператор
    definition: оператор, входящий слагаемым в гамильтониан системы
  СлагаемоеРНП:
    parent: СлагаемоеГамильтониана
    definition: слагаемое гамильтониана, описывающее расщепление в нулевом поле
  Автор:
    parent: null
    definition: человек — автор опубликованной работы
  ЗапросКГрафу:
    parent: Процесс
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей

    
properties:
  подзадачаОт:   {domain: Задача, range: Задача, characteristics: [транзитивное]}
  решает:        {domain: [Эксперимент, Проверка], range: Задача}
  выполняет:     {domain: Отчёт, range: Задача}
  проверяет:     {domain: Эксперимент, range: Гипотеза}
  использует:    {domain: Эксперимент, range: НаборДанных}
  применяет:     {domain: Эксперимент, range: Метод}
  исследует:     {domain: Эксперимент, range: ФизическийОбъект}
  взаимодействуетС: {domain: ВзаимодействиеСИзлучением, range: ФизическийОбъект}
  сопровождается: {domain: Процесс, range: Процесс}
  даёт:          {domain: Эксперимент, range: Результат}
  подтверждает:  {domain: Результат, range: Гипотеза}
  опровергает:   {domain: Результат, range: Гипотеза}
  проверенЧерез: {domain: Результат, range: Проверка}
  ограничивает:  {domain: Ограничение, range: [НаборДанных, Результат, ПараметрВЗадаче, ПостановкаОценивания]}
  основанаНа:    {domain: [Гипотеза, Метод], range: Источник}
  ссылаетсяНа:   {domain: Отчёт, range: Источник}
  хранитсяВ:     {domain: [НаборДанных, Результат, Источник, Матрица, УсловияРегистрацииЭПР], range: Файл}
  реализованВ:   {domain: [Эксперимент, Проверка], range: Файл}
  входитВ:      {domain: [ИнформационныйОбъект, Процесс], range: [ИнформационныйОбъект, Процесс], characteristics: [транзитивное]}
  содержит:     {domain: [ИнформационныйОбъект, Процесс], range: [ИнформационныйОбъект, Процесс], characteristics: [транзитивное]}
  представляет: {domain: МатематическийОбъект, range: ИнформационныйОбъект}
  описывает:    {domain: ИнформационныйОбъект, range: [ИнформационныйОбъект, Процесс, ФизическоеЯвление]}
  характеризует: {domain: ИнформационныйОбъект, range: [ИнформационныйОбъект, Процесс, ФизическоеЯвление]}
  соответствует: {domain: ИнформационныйОбъект, range: ИнформационныйОбъект}
  заданДля:     {domain: ИнформационныйОбъект, range: ИнформационныйОбъект}
  удовлетворяет: {domain: МатематическийОбъект, range: МатематическоеСоотношение}
  связывает:    {domain: СоотношениеПараметров, range: ПараметрВЗадаче}
  участвуетВ:   {domain: ПараметрВЗадаче, range: СоотношениеПараметров}
  определяет:   {domain: ФункциональнаяЗависимостьПараметров, range: ЗависимыйПараметр}
  действуетНа:  {domain: Оператор, range: Вектор}
  вход:         {domain: Процесс, range: ИнформационныйОбъект}
  выход:        {domain: Процесс, range: ИнформационныйОбъект}
  полученВ:     {domain: ИнформационныйОбъект, range: Процесс}
  вычисленИз:   {domain: ИнформационныйОбъект, range: ИнформационныйОбъект}
  найденЗапросом: {domain: Источник, range: ЗапросКГрафу}
  написан:        {domain: Источник, range: Автор}
  цитирует:       {domain: Источник, range: Источник}
  
  

# Атрибуты — поля в начале заметки. values задаёт допустимые категории.
# datatype/unit задают тип и единицу числового или текстового поля; это
# декларативное расширение описания, а не автоматически исполняемая проверка.
# Неизвестное значение не заполняют догадкой или нулём. Все параметры условий
# необязательны до получения подтверждения из протокола или метаданных измерения.
