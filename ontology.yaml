  - id: П24
    text: "Каждое собственное значение связано хотя бы с одной собственной парой, задающей контекст оператора."
    dl: "СобственноеЗначение ⊑ ∃соответствует⁻.СобственнаяПара"
    check: {kind: some_inverse, class: СобственноеЗначение, property: соответствует, source: СобственнаяПара}
  - id: П25
    text: "Каждый уровень энергии задан для гамильтониана."
    dl: "УровеньЭнергии ⊑ ∃заданДля.Гамильтониан"
    check: {kind: some, class: УровеньЭнергии, property: заданДля, target: Гамильтониан}
  - id: П26
    text: "Каждое собственное состояние энергии задано для гамильтониана."
    dl: "СобственноеСостояниеЭнергии ⊑ ∃заданДля.Гамильтониан"
    check: {kind: some, class: СобственноеСостояниеЭнергии, property: заданДля, target: Гамильтониан}
  - id: П27
    text: "Каждое собственное состояние энергии представлено собственным вектором."
    dl: "СобственноеСостояниеЭнергии ⊑ ∃представляет⁻.СобственныйВектор"
    check: {kind: some_inverse, class: СобственноеСостояниеЭнергии, property: представляет, source: СобственныйВектор}
  - id: П28
    text: "Каждому собственному состоянию энергии соответствует уровень энергии."
    dl: "СобственноеСостояниеЭнергии ⊑ ∃соответствует.УровеньЭнергии"
    check: {kind: some, class: СобственноеСостояниеЭнергии, property: соответствует, target: УровеньЭнергии}
  - id: П29
    text: "Каждая населённость задана для конкретного уровня энергии."
    dl: "НаселённостьУровняЭнергии ⊑ ∃заданДля.УровеньЭнергии"
    check: {kind: some, class: НаселённостьУровняЭнергии, property: заданДля, target: УровеньЭнергии}
  - id: П30
    text: "Каждая населённость задана для квантового состояния, определяющего контекст распределения."
    dl: "НаселённостьУровняЭнергии ⊑ ∃заданДля.КвантовоеСостояние"
    check: {kind: some, class: НаселённостьУровняЭнергии, property: заданДля, target: КвантовоеСостояние}
  - id: П31
    text: "Каждый описанный интервал квантовой эволюции имеет на входе квантовое состояние."
    dl: "КвантоваяЭволюция ⊑ ∃вход.КвантовоеСостояние"
    check: {kind: some, class: КвантоваяЭволюция, property: вход, target: КвантовоеСостояние}
  - id: П32
    text: "Каждый описанный интервал квантовой эволюции имеет на выходе квантовое состояние."
    dl: "КвантоваяЭволюция ⊑ ∃выход.КвантовоеСостояние"
    check: {kind: some, class: КвантоваяЭволюция, property: выход, target: КвантовоеСостояние}
  - id: П33
    text: "Каждая унитарная эволюция описывается гамильтонианом."
    dl: "УнитарнаяЭволюция ⊑ ∃описывает⁻.Гамильтониан"
    check: {kind: some_inverse, class: УнитарнаяЭволюция, property: описывает, source: Гамильтониан}
  - id: П34
    text: "Каждое слагаемое гамильтониана входит в гамильтониан."
    dl: "СлагаемоеГамильтониана ⊑ ∃входитВ.Гамильтониан"
    check: {kind: some, class: СлагаемоеГамильтониана, property: входитВ, target: Гамильтониан}
  - id: П35
    text: "Каждое слагаемое РНП описывает расщепление в нулевом поле."
    dl: "СлагаемоеРНП ⊑ ∃описывает.РасщеплениеВНулевомПоле"
    check: {kind: some, class: СлагаемоеРНП, property: описывает, target: РасщеплениеВНулевомПоле}
  - id: П36
    text: "Каждый параметр РНП задан для слагаемого РНП."
    dl: "ПараметрРНП ⊑ ∃заданДля.СлагаемоеРНП"
    check: {kind: some, class: ПараметрРНП, property: заданДля, target: СлагаемоеРНП}
  - id: П37
    text: "Для собственной пары (λ, v), заданной для A, выполняется A v = λ v и v не равен нулю. Вектор и значение относятся к одному и тому же A."
    dl: "— (математическая проверка собственной пары по данным оператора и вектора)"
  - id: П38
    text: "Гамильтониан собственного состояния энергии совпадает с гамильтонианом соответствующего уровня энергии и собственной пары представляющего вектора. Один уровень может соответствовать нескольким состояниям при вырождении."
    dl: "— (проверка согласованности контекста связанных объектов)"
  - id: П39
    text: "Числовое значение вероятности вещественно и принадлежит отрезку от нуля до единицы включительно."
    dl: "— (числовая проверка значения вероятности)"
  - id: П40
    text: "Для одного квантового состояния и гамильтониана сумма населённостей по всем различным уровням полного дискретного спектра равна единице. При усечённом наборе уровней нормировка на него должна быть оговорена отдельно."
    dl: "— (числовая проверка нормировки с учётом полноты набора уровней)"
  - id: П41
    text: "Населённость уровня с энергией E вычисляется как Tr(ρ P_E), где P_E — проектор на всё подпространство этого уровня. Для вырожденного уровня суммируются вклады всех его ортонормированных собственных состояний."
    dl: "— (числовая проверка населённости в согласованном энергетическом базисе)"
  - id: П42
    text: "Оператор плотности положителен и имеет единичный след. Для чистого состояния ρ² = ρ; для смешанного состояния Tr(ρ²) меньше единицы. Оператор плотности определяется на том же пространстве, что и соответствующее состояние."
    dl: "— (проверка математических данных оператора плотности)"
  - id: П43
    text: "Гамильтониан самосопряжён на своей области определения; в конечномерном матричном представлении H† = H."
    dl: "— (проверка самосопряжённости, в матричном расчёте с заданным числовым допуском)"
  - id: П44
    text: "Для унитарной эволюции от t0 до t1 выполняются U†U = UU† = I и ρ(t1) = U ρ(t0) U†; для нормированного вектора чистого состояния ψ(t1) = U ψ(t0). Преобразование U согласовано с описывающим эволюцию гамильтонианом."
    dl: "— (проверка преобразования состояния и его согласованности с гамильтонианом)"
  - id: П45
    text: "При квадратичном описании РНП в главных осях H_РНП = D[S_z² − S(S+1)I/3] + E[S_x² − S_y²]. При безразмерных операторах спина D и E заданы в единицах энергии; при записи H_РНП/h — в единицах частоты; в ЭПР-спектроскопии могут быть заданы через единицы магнитного поля H_РНП/gβ. Соглашение об осях сохраняется вместе с параметрами; перестановка x и y меняет знак E."
    dl: "— (проверка соглашения, единиц и математических данных слагаемого РНП)"
# Правила ЭПР: check использует только уже имеющиеся виды структурных проверок.
# Числовые и условные правила без check проверяются отдельно; локальный
# check_project_workflow.py сам по себе не исполняет rules/check и attributes.
  - id: Э1
    text: Спектроскопический эксперимент применяет хотя бы один метод спектроскопии.
    dl: "СпектроскопическийЭксперимент ⊑ ∃применяет.Спектроскопия"
    check: {kind: some, class: СпектроскопическийЭксперимент, property: применяет, target: Спектроскопия}
  - id: Э2
    text: ЭПР-эксперимент применяет хотя бы один метод ЭПР-спектроскопии.
    dl: "ЭПРэксперимент ⊑ ∃применяет.ЭПРспектроскопия"
    check: {kind: some, class: ЭПРэксперимент, property: применяет, target: ЭПРспектроскопия}
  - id: Э3
    text: ВР ЭПР эксперимент применяет метод временно-разрешённой ЭПР-спектроскопии.
    dl: "ВРЭПРэксперимент ⊑ ∃применяет.ВРЭПРспектроскопия"
    check: {kind: some, class: ВРЭПРэксперимент, property: применяет, target: ВРЭПРспектроскопия}
  - id: Э4
    text: Выход спектроскопического эксперимента включает спектральные данные.
    dl: "СпектроскопическийЭксперимент ⊑ ∃выход.СпектральныеДанные"
    check: {kind: some, class: СпектроскопическийЭксперимент, property: выход, target: СпектральныеДанные}
  - id: Э5
    text: Выход ЭПР-эксперимента включает ЭПР-данные.
    dl: "ЭПРэксперимент ⊑ ∃выход.ЭПРданные"
    check: {kind: some, class: ЭПРэксперимент, property: выход, target: ЭПРданные}
  - id: Э6
    text: Выход ВР ЭПР эксперимента включает данные с временной координатой.
    dl: "ВРЭПРэксперимент ⊑ ∃выход.ВРЭПРданные"
    check: {kind: some, class: ВРЭПРэксперимент, property: выход, target: ВРЭПРданные}
  - id: Э7
    text: ЭПР-эксперимент исследует хотя бы один физический образец.
    dl: "ЭПРэксперимент ⊑ ∃исследует.Образец"
    check: {kind: some, class: ЭПРэксперимент, property: исследует, target: Образец}
  - id: Э8
    text: Серия экспериментов содержит хотя бы один эксперимент; отдельный опыт входит в серию только при наличии сведений об общем плане.
    dl: "СерияЭкспериментов ⊑ ∃содержит.Эксперимент"
    check: {kind: some, class: СерияЭкспериментов, property: содержит, target: Эксперимент}
  - id: Э9
    text: Спектроскопический метод является описанием способа работы и не является самим экспериментальным процессом.
    dl: "DisjointClasses(Спектроскопия СпектроскопическийЭксперимент)"
  - id: Э10
    text: Отношения выход и полученВ взаимно обратны; CSV содержит представление данных, а не сам экспериментальный процесс.
    dl: "InverseObjectProperties(выход полученВ)"
  - id: Э11
    text: Исходные измеренные ВР ЭПР данные указывают эксперимент, в котором они зарегистрированы. Обработанные данные могут быть выходом отдельного процесса обработки, а расчётные не требуют вымышленного физического эксперимента.
    dl: "ВРЭПРданные ⊓ ∃происхождение.{измеренное} ⊓ ∃стадияОбработки.{исходные} ⊑ ∃полученВ.ВРЭПРэксперимент"
  - id: Э12
    text: Производные или обработанные спектральные данные указывают исходный набор, из которого они вычислены; срез при фиксированном времени можно описывать как ЭПРспектр.
    dl: "СпектральныеДанные ⊓ (∃происхождение.{производное} ⊔ ∃стадияОбработки.{обработанные}) ⊑ ∃вычисленИз.НаборДанных"
  - id: Э13
    text: При наличии временной координаты описывают начало отсчёта и единицы времени. Отрицательная задержка допустима для регистрации до воздействия; неизвестные параметры не подменяют нулями.
    dl: "— (проверка метаданных временной оси и начала отсчёта)"
  - id: Э14
    text: Временное разрешение характеризует способность установки различать изменения сигнала и не отождествляется с шагом временной сетки. Если оно указано, значение конечно, положительно и задано в ns.
    dl: "— (проверка инструментального временного разрешения)"
  - id: Э15
    text: Временно-разрешённая регистрация не определяет режим СВЧ. ВР ЭПР возможна с непрерывными микроволнами и импульсным оптическим возбуждением; режимСВЧ и типВозбуждения описываются независимо.
    dl: "— (проверка независимости условий возбуждения и регистрации)"
  - id: Э16
    text: Указанная частотаСВЧ конечна и положительна в GHz, температура конечна и неотрицательна в K, числоНакоплений является положительным целым числом. Отсутствующее значение означает отсутствие сведений, а не ноль.
    dl: "— (числовая проверка условий эксперимента и единиц)"
  - id: Э17
    text: Длина волны и длительность импульса относятся к воздействию, указанному в типВозбуждения; их заданные значения конечны и положительны в nm и ns соответственно. При нескольких воздействиях явно записывают, какому импульсу принадлежит значение. Эти параметры нельзя выводить только из названия файла или типа эксперимента.
    dl: "— (проверка условий возбуждения по протоколу или метаданным)"
  - id: Э18
    text: Происхождение и стадия обработки — разные признаки. Обработанные измерения и рассчитанные спектры не объявляются исходными измеренными данными; канал регистрации и порядок производной задаются отдельно.
    dl: "— (проверка происхождения, обработки и представления сигнала)"

# CW, спиновая поляризация и физический смысл зарегистрированного отклика.
# Источники соглашений, а не основание приписывать свойства реальным данным:
# https://easyspin.org/documentation/spinpolarization.html
# https://easyspin.org/documentation/pepper.html
# https://doi.org/10.1002/cmr.a.20018
# https://www.bruker.com/en/products-and-solutions/mr/epr-instruments/multi-harmonic-detection.html
# check проверяет лишь указанные внешние связи. Вложенные условия DL,
# фазовые соглашения, происхождение сигнала и численные формулы проверяются отдельно.
  - id: С1
    text: CW-эксперимент применяет метод непрерывноволновой ЭПР-спектроскопии.
    dl: "CWЭПРэксперимент ⊑ ∃применяет.CWЭПРспектроскопия"
    check: {kind: some, class: CWЭПРэксперимент, property: применяет, target: CWЭПРспектроскопия}
  - id: С2
    text: Спектр ЭПР указывает описание условий регистрации или соответствующего расчётного представления.
    dl: "ЭПРспектр ⊑ ∃заданДля.УсловияРегистрацииЭПР"
    check: {kind: some, class: ЭПРспектр, property: заданДля, target: УсловияРегистрацииЭПР}
  - id: С3
    text: Условия регистрации содержат описание применяемого метода регистрации сигнала.
    dl: "УсловияРегистрацииЭПР ⊑ ∃содержит.МетодРегистрации"
    check: {kind: some, class: УсловияРегистрацииЭПР, property: содержит, target: МетодРегистрации}
  - id: С4
    text: Спин-поляризованный спектр описывает неравновесное спиновое состояние.
    dl: "СпинПоляризованныйЭПРспектр ⊑ ∃описывает.НеравновесноеСпиновоеСостояние"
    check: {kind: some, class: СпинПоляризованныйЭПРспектр, property: описывает, target: НеравновесноеСпиновоеСостояние}
  - id: С5
    text: Тепловой спектр описывает тепловое спиновое состояние при заданных условиях сравнения.
    dl: "ТепловойЭПРспектр ⊑ ∃описывает.ТепловоеСпиновоеСостояние"
    check: {kind: some, class: ТепловойЭПРспектр, property: описывает, target: ТепловоеСпиновоеСостояние}
  - id: С6
    text: Гармоника модуляционного отклика задаётся для условий, в которых описана опорная модуляция магнитного поля; check проверяет только связь с условиями.
    dl: "ГармоникаМодуляционногоОтклика ⊑ ∃заданДля.(УсловияРегистрацииЭПР ⊓ ∃описывает.МодуляцияМагнитногоПоля)"
    check: {kind: some, class: ГармоникаМодуляционногоОтклика, property: заданДля, target: УсловияРегистрацииЭПР}
  - id: С7
    text: Компонента указывает родительский спектр; границы выделения, разложение и преобразования сохраняются вместе с происхождением данных.
    dl: "КомпонентаЭПРспектра ⊑ ∃входитВ.ЭПРспектр"
    check: {kind: some, class: КомпонентаЭПРспектра, property: входитВ, target: ЭПРспектр}
  - id: С8
    text: Абсорбционная компонента описывает поглощение СВЧ спиновой системой.
    dl: "АбсорбционнаяКомпонентаЭПР ⊑ ∃описывает.ПоглощениеСВЧ"
    check: {kind: some, class: АбсорбционнаяКомпонентаЭПР, property: описывает, target: ПоглощениеСВЧ}
  - id: С9
    text: Эмиссионная компонента ЭПР описывает вынужденную эмиссию СВЧ, а не автоматически спонтанное излучение.
    dl: "ЭмиссионнаяКомпонентаЭПР ⊑ ∃описывает.ВынужденнаяЭмиссияСВЧ"
    check: {kind: some, class: ЭмиссионнаяКомпонентаЭПР, property: описывает, target: ВынужденнаяЭмиссияСВЧ}
  - id: С10
    text: Спиновое состояние задано для выбранного спинового гамильтониана.
    dl: "СпиновоеСостояние ⊑ ∃заданДля.СпиновыйГамильтониан"
    check: {kind: some, class: СпиновоеСостояние, property: заданДля, target: СпиновыйГамильтониан}
  - id: С11
    text: Спиновое состояние, включая чистое, имеет представление оператором плотности.
    dl: "СпиновоеСостояние ⊑ ∃представляет⁻.ОператорПлотности"
    check: {kind: some_inverse, class: СпиновоеСостояние, property: представляет, source: ОператорПлотности}
  - id: С12
    text: Спиновая поляризация характеризует спиновое состояние.
    dl: "СпиноваяПоляризация ⊑ ∃характеризует.СпиновоеСостояние"
    check: {kind: some, class: СпиноваяПоляризация, property: характеризует, target: СпиновоеСостояние}
  - id: С13
    text: Неравновесная спиновая поляризация характеризует неравновесное состояние.
    dl: "НеравновеснаяСпиноваяПоляризация ⊑ ∃характеризует.НеравновесноеСпиновоеСостояние"
    check: {kind: some, class: НеравновеснаяСпиноваяПоляризация, property: характеризует, target: НеравновесноеСпиновоеСостояние}
  - id: С14
    text: Неравновесное спиновое состояние характеризуется неравновесной спиновой поляризацией.
    dl: "НеравновесноеСпиновоеСостояние ⊑ ∃характеризует⁻.НеравновеснаяСпиноваяПоляризация"
    check: {kind: some_inverse, class: НеравновесноеСпиновоеСостояние, property: характеризует, source: НеравновеснаяСпиноваяПоляризация}
  - id: С15
    text: Квантовый переход является квантовой эволюцией; существующие отношения вход и выход обозначают его начальное и конечное состояния, а не скалярные энергии.
    dl: "КвантовыйПереход ⊑ КвантоваяЭволюция"
  - id: С16
    text: Начальное и конечное состояния перехода описываются в согласованном пространстве; изменение базиса указывают явно, а энергии связывают с состояниями через соответствующие собственные пары.
    dl: "— (проверка согласованности начального и конечного состояний)"
  - id: С17
    text: Начальное состояние спинового перехода принадлежит выбранной спиновой модели.
    dl: "СпиновыйПереход ⊑ ∃вход.СпиновоеСостояние"
    check: {kind: some, class: СпиновыйПереход, property: вход, target: СпиновоеСостояние}
  - id: С18
    text: Конечное состояние спинового перехода принадлежит выбранной спиновой модели.
    dl: "СпиновыйПереход ⊑ ∃выход.СпиновоеСостояние"
    check: {kind: some, class: СпиновыйПереход, property: выход, target: СпиновоеСостояние}
  - id: С19
    text: Взаимодействие с излучением указывает само электромагнитное излучение.
    dl: "ВзаимодействиеСИзлучением ⊑ ∃взаимодействуетС.ЭлектромагнитноеИзлучение"
    check: {kind: some, class: ВзаимодействиеСИзлучением, property: взаимодействуетС, target: ЭлектромагнитноеИзлучение}
  - id: С20
    text: Поглощение СВЧ относится к микроволновому излучению.
    dl: "ПоглощениеСВЧ ⊑ ∃взаимодействуетС.СВЧизлучение"
    check: {kind: some, class: ПоглощениеСВЧ, property: взаимодействуетС, target: СВЧизлучение}
  - id: С21
    text: Эмиссия СВЧ относится к микроволновому излучению.
    dl: "ЭмиссияСВЧ ⊑ ∃взаимодействуетС.СВЧизлучение"
    check: {kind: some, class: ЭмиссияСВЧ, property: взаимодействуетС, target: СВЧизлучение}
  - id: С22
    text: "Для CWЭПРэксперимент и условий CWЭПРспектр режимСВЧ равен непрерывный. Синонимы CW-EPR, CWEPR и непрерывноволновая ЭПР обозначают способ СВЧ-зондирования; наличие первой производной или тепловых населённостей из этого не следует."
    dl: "CWЭПРэксперимент ⊑ ∃режимСВЧ.{непрерывный}"
  - id: С23
    text: "Исходный измеренный CW-спектр указывает CWЭПРэксперимент. Расчётный спектр не требует вымышленного физического опыта: фиксируют модель, состояние, условия и процесс расчёта. Класс CW-эксперимента не обязывает объявлять временную кинетику при одном поле полноценным полевым спектром."
    dl: "CWЭПРспектр ⊓ ∃происхождение.{измеренное} ⊓ ∃стадияОбработки.{исходные} ⊑ ∃полученВ.CWЭПРэксперимент"
  - id: С24
    text: "Непрерывное СВЧ-зондирование, временное разрешение и неравновесная спиновая поляризация — разные признаки. CWЭПРспектр и СпинПоляризованныйЭПРспектр не объявляются непересекающимися; предусмотрен их совместный подкласс. Неравновесие не обязательно нестационарно, а спин-поляризованный спектр не обязательно содержит одновременно A и E или зарегистрирован после лазерной вспышки."
    dl: "— (проверка независимости способа зондирования, временного режима и состояния)"
  - id: С25
    text: "Абсорбция и эмиссия обозначают направления чистого переноса энергии; измеренный знак амплитуды зависит также от представления, фазы, базовой линии и соглашений прибора. Абсорбционный канал, обозначенный значением поглощение в каналРегистрации, может содержать как абсорбционные, так и эмиссионные вклады. Дисперсионный канал не является синонимом эмиссии."
    dl: "— (проверка физической интерпретации компонент и каналов)"
  - id: С26
    text: "Номер гармоники n — целое неотрицательное число относительно опорной частоты модуляции f_mod. Для n>0 частота выделения равна n*f_mod, для n=0 это постоянная составляющая. Частота модуляции и её гармоники не являются частотой СВЧ-несущей. Нулевая гармоника при конечной амплитуде модуляции может быть усреднённым, искажённым откликом."
    dl: "— (проверка номера гармоники и частотного соглашения)"
  - id: С27
    text: "Сопоставление n-й гармоники n-й производной по магнитному полю является приближением для слабой синусоидальной модуляции, квазистационарного отклика и согласованных фаз. При перемодуляции, динамических эффектах или другом фазовом выборе требуется модель регистрации; гармоника не отождествляется с точной производной автоматически."
    dl: "— (проверка применимости производного приближения)"
  - id: С28
    text: "Фаза СВЧ-регистрации определяет выбор абсорбционной и дисперсионной квадратур; фаза модуляционной регистрации задаёт опору синхронного детектора. Это разные настройки. Указывают обе опоры и доступную калибровку; поворот фазы на 180 градусов может изменить знак данных, не меняя физическое направление переноса энергии."
    dl: "— (проверка фаз и соглашения о знаке)"
  - id: С29
    text: "Порядок производной задаётся неотрицательным целым числом только при известном производном представлении; для положительного порядка указывают координатаДифференцирования. Номер гармоники и порядокПроизводной хранятся раздельно. Отсутствующие сведения не заменяют нулём или единицей. Многогармонические данные хранят как отдельные компоненты или каналы с собственными номерами."
    dl: "— (проверка представления, координаты производной и каналов)"
  - id: С30
    text: "ПрямаяРегистрация не требует полевой модуляции, но может использовать фазочувствительное СВЧ-смешение. Для гармонического представления спектр связывают с ГармоникаМодуляционногоОтклика через содержит; гармоника и спектр указывают согласованные условия, в которых описана модуляция. Оптическое возбуждение и непрерывное СВЧ-зондирование описывают отдельно."
    dl: "— (проверка схемы регистрации и связи спектра с гармоникой)"
  - id: С31
    text: "При положительной температуре T тепловое состояние задаётся rho_eq=exp(-H/(k_B*T))/Tr(exp(-H/(k_B*T))); для T=0 используют соответствующий предел, а не деление на ноль. Температура сравнения, гамильтониан, поле и модель совпадают при сопоставлении теплового и неравновесного состояний. Наличие тепловой спиновой поляризации само по себе не делает спектр СпинПоляризованныйЭПРспектр в принятом здесь неравновесном смысле."
    dl: "— (проверка теплового эталона и смысла спиновой поляризации)"
  - id: С32
    text: "Оператор плотности, населённости и волновые функции используют согласованные базис и порядок состояний. Числовая Матрица может представлять ОператорПлотности, который представляет СпиновоеСостояние; файл матрицы указывается через хранитсяВ. Населённости уровней вычисляются проекторами по П41. Ненормированные относительные веса до нормировки не объявляются вероятностями; нулевая намагниченность не исключает неравновесной спиновой упорядоченности."
    dl: "— (проверка представления состояния, нормировки и порядка компонент)"
  - id: С33
    text: "В модели слабого некогерентного зондирования изолированного невырожденного перехода поглощательная интенсивность пропорциональна (p_lower-p_upper)*|<upper|mu_perp|lower>|^2. Положительная разность даёт чистое поглощение, отрицательная — вынужденную эмиссию. Для вырождения, когерентностей, насыщения и смешанных переходов используют соответствующую модель, а не это упрощение."
    dl: "— (проверка модели интенсивности и её предпосылок)"
  - id: С34
    text: "Переходы, которыми объясняют резонансные A/E-компоненты, указывают через сопровождается у описываемого поглощения или вынужденной эмиссии. В энергетическом описании используют собственные спиновые состояния и один гамильтониан при согласованных поле и ориентации; разность энергий согласуется с частотой СВЧ. При использовании H/h вместо H сохраняют частотные единицы. Сам факт микроволнового поглощения не доказывает спиновую природу сигнала."
    dl: "— (проверка резонансных переходов, поля и единиц энергии)"
  - id: С35
    text: "Отрицательная точка первой или высшей производной не доказывает эмиссию; положительные и отрицательные лепестки обычной абсорбционной линии также возможны. Знак прямого абсорбционного отклика интерпретируют как A/E только после проверки фазового соглашения, калибровки знака и удаления подтверждённых артефактов. При неизвестной фазе физический тип компоненты оставляют неустановленным."
    dl: "— (запрет вывода об эмиссии из одного знака отсчёта)"
  - id: С36
    text: "Поляризационный паттерн A/E относится к выделенным физическим компонентам при заданном порядке, обычно по возрастанию магнитного поля, и известном знаковом соглашении. Максимумы и минимумы производной не считают отдельными A/E-переходами; перекрывающиеся вклады требуют модели разложения. Наличие неравновесных населённостей не гарантирует эмиссионной компоненты каждого перехода."
    dl: "— (проверка поляризационного паттерна и выделения компонент)"
  - id: С37
    text: "При сравнении симуляции с экспериментом согласуют представлениеСигнала, канал, гармонику или производную, единицы, фазу, нормировку, поле и временное окно. Произвольное изменение знака, модуль интенсивности или сдвиг всего спектра в положительную область не сохраняют автоматически физический смысл A/E; преобразование и его обратимость записывают."
    dl: "— (проверка сопоставимости спектров и преобразований сигнала)"
  - id: С38
    text: "Частоты СВЧ и применяемой модуляции конечны и положительны; частота гармоники неотрицательна и равна нулю при n=0. ЧастотаСВЧ в GHz и частота излучения в Hz согласуются после пересчёта. Амплитуда модуляции конечна и неотрицательна в mT, её пиковое, пик-пик или среднеквадратичное соглашение указано явно. Число гармоник не ограничивается двумя лишь из-за возможностей одного программного интерфейса."
    dl: "— (числовая проверка частот, амплитуды и единиц)"
  - id: С39
    text: "Фазы конечны и заданы в deg относительно описанной опоры. Мощность конечна и неотрицательна в mW; непрерывное зондирование реального сигнала предполагает ненулевую мощность. Отсутствие насыщения не выводят только из величины мощности: указывают проверку или предпосылку режима. Заданные числовые температуры и единицы согласуют с физическим смыслом выбранного состояния сравнения."
    dl: "— (числовая проверка фаз, мощности и условий сравнения)"
  - id: С40
    text: "Для ВРЭПРспектр указывают задержку либо границы временного окна и началоОтсчёта; при наличии обеих границ начало не превышает конец. Отрицательные задержки допустимы. При усреднении по окну моделируют соответствующее усреднение и не подменяют его одним моментом без обоснования. Неизвестный момент лазерной вспышки не приравнивают к границе предлазерного окна."
    dl: "— (проверка временного среза, окна и начала отсчёта)"
  - id: С41
    text: "При разложении спектра сохраняют родительские данные через вычисленИз и связь входитВ; если представление компоненты отличается от исходного спектра, её условия и преобразования указывают отдельно. Обнаруженная отрицательная величина в дисперсии, комплексном канале или после неконтролируемого вычитания фона не является достаточным основанием для класса ЭмиссионнаяКомпонентаЭПР."
    dl: "— (проверка происхождения и интерпретации выделенных компонент)"
  - id: С42
    text: "Параметр harmonic конкретной библиотеки интерпретируют по её контракту: выбор модельной абсорбционной формы или производной не подтверждает реальный режим модуляции прибора. Если библиотека не поддерживает требуемую гармонику или представление, ограничение фиксируют; не меняют метаданные экспериментального спектра ради совместимости."
    dl: "— (проверка соответствия программной симуляции регистрации)"
  - id: С43
    text: "Новые классы не переклассифицируют существующие файлы автоматически. Режим CW, гармонику, фазы, тепловой или неравновесный характер и A/E подтверждают метаданными либо анализом с указанием происхождения; неизвестные параметры не заполняют догадкой. Проверки структуры графа не доказывают физическую правильность этих утверждений."
    dl: "— (проверка полноты описания без вымышленных экспериментальных сведений)"
  - id: С44
    text: "При одинаковых гамильтониане, поле, температуре сравнения и операторе плотности состояние не объявляют одновременно тепловым и неравновесным. Разные эталоны описывают отдельно. Расчёт, в котором использованы только тепловые населённости, не подтверждает неравновесную поляризацию лишь благодаря малому значению функции ошибки."
    dl: "— (проверка совместимости физического состояния и использованной модели)"
  - id: С45
    text: "Для выделения гармоники с n>0 условия содержат СинхронноеДетектирование или его явно описанную цифровую реализацию с опорой на модуляцию. Модельная гармоника и реально зарегистрированный канал различаются по происхождению. Для n=0 синхронное детектирование на ненулевой частоте не требуется."
    dl: "— (проверка метода выделения гармоники и его происхождения)"

# Параметры и зависимости. Источники математических соглашений:
# https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.pearsonr.html
# https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.curve_fit.html
# https://mc-stan.org/docs/stan-users-guide/reparameterization.html
# check ниже задаёт только структурные условия. Формулы, распределения,
# численные допуски и идентифицируемость проверяются отдельным анализом.
  - id: КП1
    text: Описание параметра в задаче указывает исходный параметр модели.
    dl: "ПараметрВЗадаче ⊑ ∃заданДля.ПараметрМодели"
    check: {kind: some, class: ПараметрВЗадаче, property: заданДля, target: ПараметрМодели}
  - id: КП2
    text: Роль параметра относится к конкретной постановке оценивания.
    dl: "ПараметрВЗадаче ⊑ ∃входитВ.ПостановкаОценивания"
    check: {kind: some, class: ПараметрВЗадаче, property: входитВ, target: ПостановкаОценивания}
  - id: КП3
    text: Постановка оценивания указывает выбранную модель.
    dl: "ПостановкаОценивания ⊑ ∃заданДля.Модель"
    check: {kind: some, class: ПостановкаОценивания, property: заданДля, target: Модель}
  - id: КП4
    text: Постановка оценивания содержит описание хотя бы одного параметра в задаче.
    dl: "ПостановкаОценивания ⊑ ∃содержит.ПараметрВЗадаче"
    check: {kind: some, class: ПостановкаОценивания, property: содержит, target: ПараметрВЗадаче}
  - id: КП5
    text: Процесс оценивания получает постановку на вход; данные также указываются через вход.
    dl: "ОцениваниеПараметров ⊑ ∃вход.ПостановкаОценивания"
    check: {kind: some, class: ОцениваниеПараметров, property: вход, target: ПостановкаОценивания}
  - id: КП6
    text: Оценка значения относится к параметру в конкретной постановке, а не к его общему определению.
    dl: "ОценкаПараметра ⊑ ∃заданДля.ПараметрВЗадаче"
    check: {kind: some, class: ОценкаПараметра, property: заданДля, target: ПараметрВЗадаче}
  - id: КП7
    text: Оценка параметра указывает процесс, в котором она получена.
    dl: "ОценкаПараметра ⊑ ∃полученВ.ОцениваниеПараметров"
    check: {kind: some, class: ОценкаПараметра, property: полученВ, target: ОцениваниеПараметров}
  - id: КП8
    text: Анализ зависимостей получает постановку оценивания на вход.
    dl: "АнализЗависимостиПараметров ⊑ ∃вход.ПостановкаОценивания"
    check: {kind: some, class: АнализЗависимостиПараметров, property: вход, target: ПостановкаОценивания}
  - id: КП9
    text: Соотношение параметров задаётся для одной постановки оценивания.
    dl: "СоотношениеПараметров ⊑ ∃заданДля.ПостановкаОценивания"
    check: {kind: some, class: СоотношениеПараметров, property: заданДля, target: ПостановкаОценивания}
  - id: КП10
    text: Соотношение явно перечисляет участников через связывает; однопараметрическое ограничение допустимо, а межпараметрические зависимости и независимость требуют не менее двух различных участников.
    dl: "СоотношениеПараметров ⊑ ∃связывает.ПараметрВЗадаче"
    check: {kind: some, class: СоотношениеПараметров, property: связывает, target: ПараметрВЗадаче}
  - id: КП11
    text: Зависимый параметр определяется функциональной зависимостью, а не просто участвует в статистической связи.
    dl: "ЗависимыйПараметр ⊑ ∃определяет⁻.ФункциональнаяЗависимостьПараметров"
    check: {kind: some_inverse, class: ЗависимыйПараметр, property: определяет, source: ФункциональнаяЗависимостьПараметров}
  - id: КП12
    text: Функциональная зависимость указывает вычисляемый зависимый параметр.
    dl: "ФункциональнаяЗависимостьПараметров ⊑ ∃определяет.ЗависимыйПараметр"
    check: {kind: some, class: ФункциональнаяЗависимостьПараметров, property: определяет, target: ЗависимыйПараметр}
  - id: КП13
    text: Коррелированный параметр участвует в явно описанной корреляции с другим параметром.
    dl: "КоррелированныйПараметр ⊑ ∃участвуетВ.КорреляцияПараметров"
    check: {kind: some, class: КоррелированныйПараметр, property: участвуетВ, target: КорреляцияПараметров}
  - id: КП14
    text: Некоррелированный параметр участвует в утверждении о некоррелированности с указанным другим параметром.
    dl: "НекоррелированныйПараметр ⊑ ∃участвуетВ.НекоррелированностьПараметров"
    check: {kind: some, class: НекоррелированныйПараметр, property: участвуетВ, target: НекоррелированностьПараметров}
  - id: КП15
    text: Статистическая независимость параметра задаётся относительно других участников указанного соотношения.
    dl: "СтатистическиНезависимыйПараметр ⊑ ∃участвуетВ.СтатистическаяНезависимостьПараметров"
    check: {kind: some, class: СтатистическиНезависимыйПараметр, property: участвуетВ, target: СтатистическаяНезависимостьПараметров}
  - id: КП16
    text: Описание идентифицируемости указывает постановку оценивания.
    dl: "ИдентифицируемостьПараметров ⊑ ∃заданДля.ПостановкаОценивания"
    check: {kind: some, class: ИдентифицируемостьПараметров, property: заданДля, target: ПостановкаОценивания}
  - id: КП17
    text: Описание идентифицируемости перечисляет характеризуемые параметры в данной постановке.
    dl: "ИдентифицируемостьПараметров ⊑ ∃характеризует.ПараметрВЗадаче"
    check: {kind: some, class: ИдентифицируемостьПараметров, property: характеризует, target: ПараметрВЗадаче}
  - id: КП18
    text: Отношения связывает и участвуетВ взаимно обратны; участники соотношения принадлежат той же постановке, для которой оно задано.
    dl: "InverseObjectProperties(связывает участвуетВ)"
  - id: КП19
    text: "ПараметрВЗадаче указывает ровно один исходный ПараметрМодели и ровно одну ПостановкаОценивания. В другой постановке создаётся другое описание роли того же параметра. Постановка фиксирует данные через характеризует, параметризацию, критерий и ограничения; ограничения включаются через содержит."
    dl: "ПараметрВЗадаче ⊑ (=1 заданДля.ПараметрМодели) ⊓ (=1 входитВ.ПостановкаОценивания)"
  - id: КП20
    text: "НезависимыйПараметр, ЗависимыйПараметр и ФиксированныйПараметр — разные роли в одной постановке. Для функциональной зависимости записывают формулу и область применимости; определяет указывает ровно один вычисляемый параметр, который также входит в список связывает. Остальные участники задают аргументы формулы."
    dl: "DisjointClasses(НезависимыйПараметр ЗависимыйПараметр ФиксированныйПараметр)"
  - id: КП21
    text: "Свободный параметр подбора описывается классом НезависимыйПараметр; отдельный дублирующий класс не нужен. Независимость при варьировании совместима с корреляцией оценок. Статистическая независимость не следует из способа задания координат оптимизатору."
    dl: "— (различение координат подбора и статистических свойств оценок)"
  - id: КП22
    text: "Корреляция и некоррелированность относятся ровно к двум различным параметрам, распределению и условиям, а не к параметру навсегда. Один параметр может коррелировать с одним участником и быть некоррелированным с другим; соответствующие классы ролей не объявляются непересекающимися. Парные статистические связи симметричны, но в общем случае не транзитивны."
    dl: "— (проверка участников, области утверждения и вероятностного контекста)"
  - id: КП23
    text: "Для Пирсона rho(X,Y)=Cov(X,Y)/(sigma_X*sigma_Y), где обе дисперсии конечны и положительны; значение безразмерно и лежит от -1 до 1. При нулевой дисперсии коэффициент не определён и не заменяется нулём. Числовой коэффициент для параметров задаётся для конкретного СоотношениеПараметров через заданДля."
    dl: "— (числовая проверка коэффициента и его области определения)"
  - id: КП24
    text: "Нулевая корреляция не доказывает статистическую независимость: нелинейная зависимость может сохраняться. Независимость означает факторизацию совместного закона и влечёт нулевую ковариацию при существующих конечных вторых моментах. Обратный вывод допустим, например, при совместной нормальности; предпосылку записывают явно."
    dl: "— (проверка логического основания вывода о независимости)"
  - id: КП25
    text: "Для набора из более чем двух параметров статистическая независимость означает совместную факторизацию по всем участникам. Попарной независимости недостаточно; отсутствие значимых парных корреляций также не подтверждает совместную независимость."
    dl: "— (проверка многомерного вероятностного утверждения)"
  - id: КП26
    text: "Указывают основаниеВывода: аналитическое соотношение, модельное допущение или численная оценка. Ненулевой выборочный коэффициент сам по себе не доказывает ненулевую корреляцию распределения; близость к нулю и незначимый тест не доказывают независимость. Для численного вывода сохраняют метод, неопределённость и заранее выбранный критерий; универсальный порог сильной корреляции не назначается."
    dl: "— (проверка доказательности и условий статистического вывода)"
  - id: КП27
    text: "АнализЗависимостиПараметров задаёт вероятностноеОписание: например, распределение оценивателя при повторных измерениях, бутстреп или апостериорное распределение при указанных априорных предположениях. Корреляция не определяется по двум единственным оценённым числам. Численные соотношения указывают полученВ на этот анализ. История проб оптимизатора TPE или Cobyla сама по себе не является выборкой из такого распределения."
    dl: "— (проверка происхождения вероятностного описания)"
  - id: КП28
    text: "Численные оценки, фиксированные значения и заданные границы конечны, нижняяГраница не больше верхняяГраница. Значение фиксированного параметра указывают явно. Стандартная неопределённость неотрицательна и имеет единицу исходного параметра; отсутствие сведений не заменяют нулём. Порог абсолютной корреляции, если выбран, лежит от 0 до 1; числоРеализаций — положительное целое число."
    dl: "— (числовая проверка значений, границ, единиц и неопределённости)"
  - id: КП29
    text: "Ковариационные и корреляционные матрицы, описывающие параметры подбора, задаются для ПостановкаОценивания через заданДля. Атрибут порядокПараметров содержит упорядоченные идентификаторы описаний ПараметрВЗадаче; размер матрицы согласуется с числом этих идентификаторов. Файл числового массива указывается через хранитсяВ, исходные данные — через вычисленИз, выполненный анализ — через полученВ."
    dl: "— (условная проверка матриц параметров и порядка их компонент)"
  - id: КП30
    text: "Ковариационная матрица симметрична и положительно полуопределена, диагональ содержит дисперсии; единица элемента C_ij равна произведению единиц соответствующих параметров. При положительных дисперсиях R_ij=C_ij/sqrt(C_ii*C_jj); корреляционная матрица безразмерна, симметрична, положительно полуопределена и имеет единичную диагональ. Численный допуск и способ оценки сохраняют; неопределённые элементы не заполняют нулями."
    dl: "— (числовая проверка ковариационной и корреляционной матриц)"
  - id: КП31
    text: "Ковариация из локальной линейной аппроксимации модели оценивает неопределённость лишь при выполнении её предпосылок. Вырожденность и большое число обусловленности требуют анализа масштаба координат, ранга и метода расчёта; они не заменяют самостоятельного вывода об идентифицируемости."
    dl: "— (проверка применимости локальной оценки ковариации)"
  - id: КП32
    text: "Структурная идентифицируемость означает различимость параметров по идеальным предсказаниям или распределениям модели при заданном наблюдении; практическая — возможность определить их с заявленной точностью по имеющимся шумным данным. Указывают локальную или глобальную область, анализируемые параметры или их комбинации, условия и основание заключения."
    dl: "— (проверка вида, области и основания идентифицируемости)"
  - id: КП33
    text: "Хорошее совпадение спектра, сходимость оптимизатора и отсутствие улучшения в короткой контрольной доводке не доказывают уникальность параметров или их идентифицируемость. Сильная корреляция может указывать на проблему, но не равнозначна точной функциональной зависимости или структурной неидентифицируемости."
    dl: "— (запрет необоснованного вывода о единственности фита)"
  - id: КП34
    text: "Число свободных параметров — число независимо варьируемых координат после учёта фиксированных значений и точных связей. Например, при p_x+p_y+p_z=1 можно варьировать p_x и p_y, вычисляя p_z=1-p_x-p_y при сохранении допустимой области. Корреляция оценок сама по себе не уменьшает это число; статистические степени свободы требуют дополнительных предпосылок."
    dl: "— (проверка параметризации и числа независимо варьируемых координат)"
  - id: КП35
    text: "Перепараметризация указывает исходную и новую параметризации, отображение между ними и преобразование допустимой области. Локальная обратимость не объявляется глобальной без проверки; изменение координат может изменить корреляции и обусловленность, сохраняя наблюдаемые предсказания модели. Для вероятностного описания отдельно учитывают преобразование распределения."
    dl: "— (проверка эквивалентности параметризаций и переноса ограничений)"
  - id: КП36
    text: "Само наличие классов и правил не устанавливает корреляцию, независимость или идентифицируемость реальных параметров D, E, населённостей и времён жизни. Такие утверждения добавляют только после анализа или как явно помеченное допущение с указанной постановкой; неизвестные свойства не выводят из отсутствия связей в графе."
    dl: "— (проверка происхождения утверждений и отсутствия вымышленных результатов)"
  - id: КП37
    text: Ограничение параметров указывает ограничиваемую постановку через ограничивает; отдельные затронутые параметры можно также связать этим отношением.
    dl: "ОграничениеПараметров ⊑ ∃ограничивает.ПостановкаОценивания"
    check: {kind: some, class: ОграничениеПараметров, property: ограничивает, target: ПостановкаОценивания}

# Правила для работы с источниками
  - id: Л1
    text: Каждый источник указывает запрос к внешнему графу, которым он найден или сверен.
    dl: "Источник ⊑ ∃найденЗапросом.ЗапросКГрафу"
  - id: Л2
    text: У каждого источника записан хотя бы один автор.
    dl: "Источник ⊑ ∃написан.Автор"
